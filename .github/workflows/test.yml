# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python testing

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # prevent cancelling other jobs if one version fails
      fail-fast: false 
      matrix:
        # Define the versions you want to test here
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 1. Install the specific Python version for this matrix job
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 2. Sync dependencies
      # uv will automatically detect the Python version installed above
      - name: Install dependencies
        run: uv sync

      # 3. Run tests
      - name: Run tests
        env:
          endpoint_url: ${{ secrets.ENDPOINT_URL }}
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        timeout-minutes: 5
        run: uv run pytest

  docs:
    name: Docs examples and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --group docs

      # Offline: S3 examples run against a local moto server, and any other network use fails.
      - name: Run the docs examples
        timeout-minutes: 10
        run: uv run --python 3.12 pytest README.md docs -p no:cacheprovider -rs

      - name: Build the site (strict)
        run: uv run --python 3.12 mkdocs build --strict
